<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradient for 3D effect, lighter colors -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#grad)" stroke-width="15">
    <!-- "K" with sharp lines and 3D depth -->
    <path d="M60 40 L40 100 L60 160" />
    <path d="M60 40 L45 70 L60 160" stroke-opacity="0.3"/>
    <!-- "H" with thick lines and depth -->
    <path d="M80 40 L80 160 M80 80 L120 80" />
    <path d="M80 40 L75 70 L120 80" stroke-opacity="0.3"/>
    <!-- "T" with bold cross and shadow -->
    <path d="M140 40 L140 160 M120 40 L160 40" />
    <path d="M140 40 L135 60 L160 40" stroke-opacity="0.3"/>
  </g>
</svg>
